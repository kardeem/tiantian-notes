<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天天师兄·考研笔记总库</title>
<style>
:root{--bg:#0f1420;--bg2:#161d2e;--bg3:#1d2740;--fg:#e6ebf5;--fg2:#9aa7bf;--line:#2a3552;--acc:#4f8cff;--kj:#f59e0b;--mmv:#a78bfa;--mark:#ffd54f}
[data-theme="light"]{--bg:#f5f7fb;--bg2:#fff;--bg3:#eaeff7;--fg:#1c2433;--fg2:#5a6a80;--line:#d9e1ee;--acc:#2f6bff;--kj:#d97706;--mmv:#7c3aed;--mark:#ffe082}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
#topbar h1{font-size:17px;white-space:nowrap}
#searchwrap{flex:1;position:relative;max-width:620px}
#search{width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-size:14px;outline:none}
#search:focus{border-color:var(--acc)}
#searchicon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg2)}
#resultcount{font-size:12px;color:var(--fg2);white-space:nowrap}
#themeBtn{cursor:pointer;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px}
#layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:300px;flex-shrink:0;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:8px 8px 60px}
.subj-head{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;cursor:pointer;user-select:none;font-weight:600;font-size:15px}
.subj-head:hover{background:var(--bg3)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.caret{margin-left:auto;font-size:10px;color:var(--fg2);transition:transform .15s}
.subj.open .caret{transform:rotate(90deg)}
.chlist{display:none;margin:0 2px 6px 10px;border-left:2px solid var(--line);padding-left:4px}
.subj.open .chlist{display:block}
.chitem{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--fg2);display:flex;gap:6px;align-items:center}
.chitem:hover{background:var(--bg3);color:var(--fg)}
.chitem.active{background:var(--bg3);color:var(--fg);font-weight:600}
.chitem .badge{font-size:11px;color:var(--fg2);margin-left:auto;flex-shrink:0}
.mmchitem{color:var(--mmv)}
#main{flex:1;overflow-y:auto;padding:26px 30px 90px;scroll-behavior:smooth}
#main-inner{max-width:900px;margin:0 auto}
#main.flash-target{animation:flash 1.6s}
@keyframes flash{0%,60%{box-shadow:inset 0 0 0 3px var(--acc)}100%{box-shadow:none}}
h2.chtitle{font-size:24px;margin-bottom:4px}
.chsrc{color:var(--fg2);font-size:12.5px;margin-bottom:8px}
.chsubject{display:inline-block;font-size:12px;padding:3px 12px;border-radius:20px;color:#0b1020;font-weight:700;margin-bottom:18px}
.content{font-size:var(--cfs,15px);line-height:var(--clh,1.95)}
.content .h3{font-size:18px;font-weight:700;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
.content .h4{font-size:16px;font-weight:700;margin:20px 0 8px;color:var(--acc)}
.content .h5{font-weight:700;margin:14px 0 6px}
.content .p{margin:7px 0}
.content .pt{margin:5px 0 5px 1.8em}
.content .sec{margin:30px 0 14px;display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:700;color:var(--mmv)}
.content .sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kj{color:var(--kj);font-weight:600}
.content table{border-collapse:collapse;margin:12px 0;width:100%;font-size:calc(var(--cfs,15px)*0.9);background:var(--bg2)}
.content td,.content th{border:1px solid var(--line);padding:6px 9px;vertical-align:top;line-height:1.6}
.content tr:first-child td{font-weight:700;background:var(--bg3)}
figure.content-img{margin:16px 0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:640px}
figure.content-img img{width:100%;display:block;cursor:zoom-in;background:#fff}
figure.content-img figcaption{padding:8px 12px;font-size:12.5px;color:var(--fg2)}
figure.content-img figcaption b{color:var(--fg);font-size:13px}
.blk{border-radius:8px;padding:2px 6px;margin:0 -6px}
.blk.hit{background:rgba(79,140,255,.18);box-shadow:0 0 0 2px var(--acc);animation:flash 1.6s}
.mmwrap{margin:34px 0 10px}
.mmhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mmtitle{font-size:15.5px;font-weight:700;color:var(--mmv)}

.tbtn:hover{color:var(--fg);border-color:var(--acc)}
.mmtree{font-size:14px;line-height:1.8;padding-left:4px}
.mmtree ul{list-style:none;padding-left:22px;position:relative}
.mmtree ul::before{content:"";position:absolute;left:8px;top:0;bottom:8px;border-left:1.5px solid var(--line)}
.mmtree li{position:relative;padding:1.5px 0}
.mmtree li::before{content:"";position:absolute;left:-14px;top:1em;width:12px;border-top:1.5px solid var(--line)}
.mmtree .nlabel{cursor:pointer;border-radius:6px;padding:1px 7px;display:inline-block}
.mmtree .nlabel:hover{background:var(--bg3)}

.d0>.nlabel{background:var(--mmv);color:#fff;font-weight:700;font-size:15px;padding:3px 12px;border-radius:8px}
.d1>.nlabel{color:var(--mmv);font-weight:700}

.mark{background:var(--mark);color:#000;border-radius:2px;padding:0 1px}
#results .resultitem{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;cursor:pointer}
#results .resultitem:hover{border-color:var(--acc)}

.rsnip{font-size:13.5px;line-height:1.7}
#intro h2{font-size:24px;margin-bottom:14px}
#intro p{color:var(--fg2);line-height:2;margin-bottom:10px;font-size:14.5px}
.subjcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:20px}
.scard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}

body.noside #sidebar{display:none}
.syshead{cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;font-size:11.5px;color:var(--fg2);padding:8px 10px 3px;font-weight:700;letter-spacing:1px;border-radius:6px}
.syshead:hover{color:var(--fg)}
.syshead .scaret{font-size:9px;color:var(--fg2);transition:transform .15s;display:inline-block}
.syswrap{display:block}
.syswrap.closed{display:none}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:250}
#setbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:26px 30px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:84vh;overflow-y:auto}
#setbox h2{font-size:19px;margin-bottom:16px}
.setrow{margin-bottom:18px}
.setrow label{font-size:14px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}
.setrow input[type=range]{width:100%;accent-color:var(--acc)}

.setrow .hint{font-size:12px;color:var(--fg2);margin-top:6px;line-height:1.7}
#setbox .setclose{margin-top:4px;width:100%;padding:9px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:14px;cursor:pointer;font-weight:700}

#aibox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px 26px;width:min(680px,94vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}

#aistatus{font-size:12.5px;color:var(--fg2);margin-bottom:12px;min-height:16px}
#aiout{flex:1;overflow-y:auto;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;line-height:1.9;white-space:pre-wrap;min-height:220px}
#aibtns{display:flex;gap:10px;margin-top:12px}
.blk{position:relative}
.blkbtn{position:absolute;top:-10px;right:2px;display:none;font-size:11px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;cursor:pointer;color:var(--fg2);z-index:5}
.blk:hover .blkbtn{display:inline-block}
.notecallout{background:rgba(245,158,11,.13);border-left:3px solid var(--kj);border-radius:8px;padding:8px 12px;margin:6px 0 12px;font-size:14px;line-height:1.8}
.notebox{background:var(--bg2);border:1px solid var(--kj);border-radius:10px;padding:10px;margin:4px 0 12px}
.notebox textarea{width:100%;min-height:90px;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none}
.notebox textarea:focus{border-color:var(--kj)}
.noteboxbtns{display:flex;gap:8px;margin-top:8px}
.noteitem{color:var(--kj)}
.mmgraph{overflow-x:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.mmgraph svg{display:block}
[data-edit]:hover{outline:1px dashed var(--acc);cursor:text}
.aichatitem{border:1px solid var(--mmv);color:var(--mmv);font-weight:600;margin-bottom:8px;background:rgba(167,139,250,.08)}
#chatlog{display:flex;flex-direction:column;gap:14px;margin:18px 0 4px}
.chatmsg{max-width:88%;padding:12px 16px;border-radius:14px;line-height:1.9;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.chatmsg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.chatmsg.ai{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:4px}
.chatmsg.ai b{color:var(--mmv)}
.chatrefs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chatref{font-size:12px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--acc)}
.chatref:hover{border-color:var(--acc)}
#chatbar{display:flex;gap:10px;align-items:flex-end;background:var(--bg);padding:12px 0 0;border-top:1px solid var(--line);position:sticky;bottom:0;margin-top:8px}
#chatin{flex:1;min-height:54px;max-height:180px;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;outline:none}
#chatin:focus{border-color:var(--mmv)}
#chatsend{cursor:pointer;background:var(--mmv);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700}
#chatsend:disabled{opacity:.5;cursor:not-allowed}
.chatempty{color:var(--fg2);font-size:13.5px;line-height:2;padding:12px 0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:6px}
</style>

    <div class="hint">在 platform.deepseek.com 创建 API Key 后粘贴到这里，Key 只保存在本机浏览器中，不会上传到任何服务器。保存后：打开章节点击「🤖 AI总结本章」可生成章节总结；左侧导航「🤖 AI 提问」可基于全站资料自由提问。</div>
  </div>

<script src="data/sl.js"></script>
<script src="data/sh.js"></script>
<script src="data/bl.js"></script>
<script src="data/nk.js"></script>
<script src="data/wk.js"></script>
<script>
const SUBJ=[window.SUBJ_sl,window.SUBJ_sh,window.SUBJ_bl,window.SUBJ_nk,window.SUBJ_wk];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let searchIndex=null, current=null;
let AUTH=true; // 登录功能已移除：笔记与编辑默认对所有访问者开放
const GRAPHS={};

/* ---------- 内科/外科按系统分组 ---------- */
const SYSTEMS={
 nk:[["呼吸系统",["COPD","肺动脉高压","肺血栓","间质性肺","支气管扩张","肺脓肿","肺炎","肺结核","哮喘","ARDS","呼吸衰竭","肺癌","胸膜疾病"]],
     ["消化系统",["胃食管反流","胃炎","消化性溃疡","肠结核","炎症性肠病","肠易激","肝性脑病","肝细胞癌","肝硬化","急性胰腺炎"]],
     ["循环系统",["心肌疾病","心包疾病","心内膜炎","高血压","心瓣膜病","冠心病","心衰","心律失常","心脏骤停"]],
     ["泌尿系统",["泌尿系统总论","尿路感染","肾衰竭","肾小球疾病"]],
     ["血液系统",["缺铁性贫血","再生障碍性贫血","溶血性贫血","出血性疾病","骨髓瘤","MDS","白血病","淋巴瘤"]],
     ["内分泌与代谢",["Graves","甲状腺功能减退","糖尿病","醛固酮","库欣","嗜铬细胞瘤","内分泌系统总论"]],
     ["风湿免疫",["风湿系统总论","红斑狼疮","类风湿","干燥综合征","血管炎"]],
     ["其他",["中毒"]]],
 wk:[["甲状腺·乳腺·胸部",["颈部疾病","食管疾病","乳房疾病","其它颈胸部疾病"]],
     ["腹部与消化",["胃肿瘤","腹腔感染","腹部损伤","肠梗阻","阑尾炎","大肠癌","大肠与肛管","腹外疝","肝脓肿","门脉高压","胰腺肿瘤","胆系疾病"]],
     ["泌尿外科",["泌外感染","泌外梗阻"]],
     ["周围血管",["周围血管疾病"]],
     ["骨科",["运动系统畸形","运动系统慢性损伤","手外伤","骨与关节感染","非化脓性关节炎","骨肿瘤","躯干骨骨折","颈腰椎","四肢骨折","骨折概论"]],
     ["外科总论",["输血","体液失衡","营养代谢","烧伤","感染","围术期","麻醉","休克","其它外科总论"]]]
};
function chGroups(s){
  const defs=SYSTEMS[s.id];
  if(!defs)return [{name:'',chs:s.chapters}];
  const groups=defs.map(d=>({name:d[0],chs:[]}));
  const rest={name:'其他',chs:[]};
  s.chapters.forEach(ch=>{
    const t=ch.title||'';
    let gi=defs.findIndex(d=>d[1].some(kw=>t===kw||t.includes(kw)));
    if(gi<0)gi=defs.findIndex(d=>d[0]==='其他');
    if(gi>=0)groups[gi].chs.push(ch);else rest.chs.push(ch);
  });
  const out=groups.filter(g=>g.chs.length);
  if(rest.chs.length)out.push(rest);
  return out;
}

/* ---------- 笔记与编辑（localStorage 持久化，无需登录） ---------- */
let NOTE_USER=localStorage.getItem('ttsx-user')||'local';
function nkey(base){return base+(NOTE_USER?'@'+NOTE_USER:'');}
function notesAll(){
  const out=[];
  const suffix=NOTE_USER?'@'+NOTE_USER:'';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('ttsx-note-'))continue;
    const isMine=suffix?k.endsWith(suffix):(k.includes('@')===false);
    if(!isMine)continue;
    try{const n=JSON.parse(localStorage.getItem(k));out.push({key:k.slice(10,suffix?-suffix.length:undefined),t:n.t,ts:n.ts||0});}catch(e){}
  }
  out.sort((a,b)=>b.ts-a.ts);
  return out;
}
function noteMeta(key){
  const parts=key.split('|');const chid=parts[0],idx=parts[1];
  for(let si=0;si<SUBJ.length;si++){
    const ch=SUBJ[si].chapters.find(c=>c.id===chid);
    if(ch)return {si,ch,chid,idx:idx};
  }
  return null;
}
function getNoteObj(cid,idx){try{const r=localStorage.getItem(nkey('ttsx-note-'+cid+'|'+idx));return r==null?null:JSON.parse(r);}catch(e){return null}}
function getEdit(cid,i){try{const r=localStorage.getItem(nkey('ttsx-edit-'+cid+'-'+i));return r==null?null:JSON.parse(r);}catch(e){return null}}

/* ---------- 旧数据迁移（兼容历史笔记键名） ---------- */
function migrateNotes(user){
  if(!user||localStorage.getItem('ttsx-migrated-'+user))return;
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&(k.startsWith('ttsx-note-')||k.startsWith('ttsx-edit-'))&&!k.includes('@'))keys.push(k);
  }
  keys.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)localStorage.setItem(k+'@'+user,v);});
  localStorage.setItem('ttsx-migrated-'+user,'1');
}
/* ---------- 用户态（登录功能已移除，笔记/编辑直接可用） ---------- */

function fmt(text){
  let t=esc(text);
  t=t.replace(/（[^（）]{1,80}）|\([^()<>]{1,80}\)/g,m=>'<span class="kj">'+m+'</span>');
  return t;
}
function kwRender(text,q){ // highlight query hits in snippets (plain text in)
  if(!q||!q.length) return esc(text);
  let t=esc(text);
  q.forEach(w=>{
    const safe=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t=t.replace(new RegExp(safe,'gi'),m=>'<mark class="mark">'+m+'</mark>');
  });
  return t;
}

  else if(b.k==='h5')inner=`<div class="blk h5"${ed} id="b${idx}">${fmt(v)}${noteBtn}</div>`;
  else if(b.k==='pt')inner=`<div class="blk pt"${ed} id="b${idx}">${fmt(v)}${noteBtn}</div>`;

  else if(b.k==='sec')inner=`<div class="blk sec" id="b${idx}">${esc(v)}</div>`;
  else if(b.k==='table'){
    const rows=v.map((r,ri)=>`<tr>${r.map(c=>`<${ri===0&&v.length>1?'th':'td'}>${fmt(c)}</${ri===0&&v.length>1?'th':'td'}>`).join('')}</tr>`).join('');
    inner=`<div class="blk" id="b${idx}"><table>${rows}</table></div>`;
  }
  else if(b.k==='img'){

    const dw=Math.max(90,Math.round((v.w||480)*640/595));
    inner=`<div class="blk" id="b${idx}"><figure class="content-img" style="width:min(100%,${dw}px)">
      <img loading="lazy" src="${esc(v.src)}" alt="${esc(v.name)}" data-cap="${esc(v.name)}" onclick="showLightbox(this)">
      <figcaption><b>${esc(v.name)}</b>${v.cap&&v.cap!==v.name?'　'+fmt(v.cap):''}</figcaption></figure></div>`;

/* ---------- 思维导图·网状图（SVG 左→右分层布局） ---------- */
function graphHTML(tree){
  if(!tree||(!tree.t&&!(tree.ch||[]).length))return null;
  let maxd=0,leaf=0;
  (function place(n,d){
    if(!n)return;n._d=d;maxd=Math.max(maxd,d);
    const ch=(n.ch||[]).filter(c=>c&&c.t);
    if(!ch.length){n._y=leaf++;return;}
    ch.forEach(c=>place(c,d+1));
    n._y=(ch[0]._y+ch[ch.length-1]._y)/2;
  })(tree,0);
  const colW=215,rowH=34,W=(maxd+1)*colW+40,H=Math.max(80,(leaf+1)*rowH);
  let s='';
  (function draw(n){
    const x=n._d*colW+12,y=n._y*rowH+rowH/2;
    const t=String(n.t||'');
    const label=t.length>14?t.slice(0,14)+'…':t;
    const w=Math.min(colW-24,Math.max(56,Math.ceil(label.length*13.5)+18));
    const kids=(n.ch||[]).filter(c=>c&&c.t);
    kids.forEach(c=>{
      const cx=c._d*colW+12,cy=c._y*rowH+rowH/2;
      s+=`<path d="M ${x+w} ${y} C ${x+w+(colW-w)/2} ${y}, ${cx-34} ${cy}, ${cx} ${cy}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
    });
    const fill=n._d===0?'var(--mmv)':n._d===1?'var(--acc)':n._d===2?'var(--bg3)':'var(--bg2)';
    const color=n._d<=1?'#fff':'var(--fg)';
    s+=`<g><rect x="${x}" y="${y-13}" width="${w}" height="26" rx="7" fill="${fill}" stroke="var(--line)"/><text x="${x+9}" y="${y+4.5}" font-size="12.5" fill="${color}">${esc(label)}</text><title>${esc(t)}</title></g>`;
    kids.forEach(draw);
  })(tree);
  return `<div class="mmgraph" style="display:none"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${s}</svg></div>`;
}
function mmViewToggle(btn,key){
  const wrap=btn.closest('.mmwrap');
  const treeEl=wrap.querySelector('.mmtree');
  let g=wrap.querySelector('.mmgraph');
  if(!g){
    g=graphHTML(GRAPHS[key]);
    if(!g){btn.textContent='（无结构）';btn.disabled=true;return;}
    treeEl.insertAdjacentHTML('afterend',g);
    g=wrap.querySelector('.mmgraph');
  }
  if(treeEl.style.display!=='none'){
    g.style.display='block';treeEl.style.display='none';btn.textContent='🌳 树形';
  }else{
    g.style.display='';treeEl.style.display='';btn.textContent='🕸 网图';
  }
}

/* ---------- search ---------- */
function buildIndex(){
  searchIndex=[];
  SUBJ.forEach((s,si)=>{
    s.chapters.forEach(ch=>{
      ch.blocks.forEach((b,i)=>{
        let txt='',kind='正文';
        if(b.k==='img'){txt=(b.v.name||'')+' '+(b.v.cap||'');kind='图片';}
        else if(b.k==='table'){txt=b.v.map(r=>r.join(' ')).join('\n');kind='表格';}
        else if(b.k==='sec'){txt=b.v;kind='板块';}
        else txt=b.v;
        if(txt.trim())searchIndex.push({si,ch:ch.id,i,k:kind,txt});
      });
    });
    (s.mind.general||[]).forEach((m,gi)=>{
      searchIndex.push({si,ch:s.id+'-mmg',i:-1,k:'导图',txt:m.t,mm:m});
    });
    Object.keys(s.mind.byCh).forEach(cid=>{
      (s.mind.byCh[cid]||[]).forEach(m=>{
        searchIndex.push({si,ch:cid,i:-1,k:'导图',txt:m.t,mm:m});
      });
    });
  });
  notesAll().forEach(n=>{
    const m=noteMeta(n.key);
    if(m)searchIndex.push({si:m.si,ch:m.chid,i:+m.idx,k:'笔记',txt:n.t});
  });
}
function doSearch(){
  const qraw=document.getElementById('search').value.trim();
  const resEl=document.getElementById('results');
  if(!qraw){resEl.style.display='none';document.getElementById('resultcount').textContent='';return;}
  if(!searchIndex)buildIndex();
  const q=qraw.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=[];
  for(const rec of searchIndex){
    const lt=rec.txt.toLowerCase();
    if(q.every(w=>lt.includes(w))){
      let snip='';
      const low=lt;
      let pos=low.indexOf(q[0]);
      if(pos<0)pos=0;
      snip=rec.txt.slice(Math.max(0,pos-25),pos+110);
      hits.push({rec,snip});
      if(hits.length>=60)break;
    }
  }
  document.getElementById('resultcount').textContent=hits.length+(hits.length>=60?'+':'')+' 条';
  resEl.innerHTML=hits.map((h,hi)=>{
    const r=h.rec;const s=SUBJ[r.si];
    const ch=s.chapters.find(c=>c.id===r.ch);
    const where=r.mm?`思维导图·${esc(r.mm.title||('P'+r.mm.page))}`:(ch?esc((r.k==='笔记'?'📒 ':'')+ch.title):'');
    return `<div class="resultitem" onclick="searchGo(${hi})">
      <div class="rmeta"><span class="dot" style="background:${s.color}"></span>${esc(s.name)} · ${where} · ${r.k}</div>
      <div class="rsnip">${kwRender(h.snip,q)}</div></div>`;
  }).join('')||'<div style="color:var(--fg2);padding:20px">无匹配结果</div>';
  resEl.dataset.q=JSON.stringify(q);
  resEl.dataset.hits=JSON.stringify(hits.map(h=>({si:h.rec.si,ch:h.rec.ch,i:h.rec.i,mm:h.rec.mm?{img:h.rec.mm.img,title:h.rec.mm.title,page:h.rec.mm.page}:null})));
  resEl.style.display='block';
}
function searchGo(hi){
  const resEl=document.getElementById('results');
  const hits=JSON.parse(resEl.dataset.hits);
  const h=hits[hi];if(!h)return;
  resEl.style.display='none';document.getElementById('search').value='';
  document.getElementById('resultcount').textContent='';
  const si=h.si;
  if(h.mm){
    // open chapter or general and scroll to that mm
    if(h.ch===SUBJ[si].id+'-mmg'){openMMGeneral(si);}
    else{openChapter(si,h.ch);}
    const imgs=document.querySelectorAll('.mmtree');
    // fallback: just scrolled to top; find the mm by title text
    const target=[...document.querySelectorAll('.mmtitle')].find(e=>e.textContent.includes(h.mm.title||''));
    if(target){const w=target.closest('.mmwrap');w.scrollIntoView({block:'start'});w.classList.add('blk','hit');setTimeout(()=>w.classList.remove('hit'),2000);}
    return;
  }
  openChapter(si,h.ch,h.i);
}

  localStorage.setItem('ttsx-theme',b.dataset.theme);
}

/* ---------- AI 总结（DeepSeek） ---------- */
let aiAbort=null;
function chapterText(){
  const s=SUBJ[current.si];
  const ch=s.chapters.find(c=>c.id===current.cid);
  let t='章节：'+ch.title+'（'+s.name+'）\n正文：\n';
  ch.blocks.forEach(b=>{
    if(b.k==='table')t+='\n'+b.v.map(r=>r.join(' | ')).join('\n')+'\n';
    else if(b.k==='img')t+='[插图:'+(b.v.name||'')+'] ';
    else if(typeof b.v==='string')t+=b.v+'\n';
  });
  return t.slice(0,10000);
}
async function aiFetchOnce(body,ctrl){
  const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',signal:ctrl.signal,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('ttsx-dskey')},body});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||('HTTP '+r.status));}
  return r;
}
async function aiFetchRetry(body,ctrl){
  let lastErr=null;
  for(let a=0;a<3;a++){
    try{return await aiFetchOnce(body,ctrl);}
    catch(e){
      if(e.name==='AbortError'||ctrl.signal.aborted)throw e;
      if(!/Failed to fetch|network|ERR/i.test(e.message))throw e;
      lastErr=e;
      await new Promise(res=>setTimeout(res,600*(a+1)));
    }
  }
  throw lastErr||new Error('网络请求失败');
}
function aiSummary(){
  if(!current)return;
  const key=localStorage.getItem('ttsx-dskey');
  if(!key){openSettings();document.getElementById('setKeyMsg').textContent='⚠ 请先填入 DeepSeek API Key';return;}
  const s=SUBJ[current.si];
  const ch=s.chapters.find(c=>c.id===current.cid);
  document.getElementById('aiTitle').textContent='🤖 AI 总结 · '+ch.title;
  document.getElementById('aiout').textContent='';
  document.getElementById('aistatus').textContent='正在请求 DeepSeek…（流式输出，网络波动会自动重试）';
  document.getElementById('aipanel').style.display='flex';
  const body=JSON.stringify({model:'deepseek-chat',stream:true,temperature:0.3,max_tokens:4096,
    messages:[
      {role:'system',content:'你是西医综合考研辅导老师。请根据学生提供的章节笔记，输出一份精炼的复习总结：1）本章核心考点（要点式，按重要性排序）；2）重点机制/鉴别对比（如有）；3）易错点提醒；4）原文中的口诀如有则保留并标注。使用 markdown 样式标题与列表，语言精炼，适合冲刺复习。'},
      {role:'user',content:chapterText()}]});
  const ctrl=new AbortController();aiAbort=ctrl;
  aiFetchRetry(body,ctrl)
  .then(r=>{
    if(!r.ok)return r.json().catch(()=>({})).then(j=>{throw new Error((j.error&&j.error.message)||('HTTP '+r.status));});
    return r;
  })
  .then(async r=>{
    const rd=r.body.getReader(),dec=new TextDecoder();
    let buf='';
    const out=document.getElementById('aiout');
    while(true){
      const {done,value}=await rd.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        const m=ln.match(/^data:\s*(.+)$/);
        if(!m||m[1].trim()==='[DONE]')continue;
        try{
          const j=JSON.parse(m[1]);
          const d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(d){out.textContent+=d;out.scrollTop=out.scrollHeight;}
        }catch(e){}
      }
    }
    document.getElementById('aistatus').textContent='完成 ✓（生成内容仅供参考，请以原文为准）';
  }).catch(e=>{
    if(e.name==='AbortError')document.getElementById('aistatus').textContent='已停止';
    else document.getElementById('aistatus').textContent='出错了：'+e.message+'（请检查 API Key 与网络）';
  }).finally(()=>{aiAbort=null;});
}
function aiStop(){if(aiAbort)aiAbort.abort();}
function aiClose(){aiStop();document.getElementById('aipanel').style.display='none';}

/* ---------- AI 提问（全站知识库检索问答） ---------- */
let aiChatLog=null,chatBusy=false,chTextCache=null;
function chatLog(){
  if(aiChatLog===null){
    try{aiChatLog=JSON.parse(localStorage.getItem('ttsx-aichat')||'[]');}catch(e){aiChatLog=[];}
    if(!Array.isArray(aiChatLog))aiChatLog=[];
  }
  return aiChatLog;
}
function chatSave(){try{localStorage.setItem('ttsx-aichat',JSON.stringify(chatLog().slice(-40)));}catch(e){}}
function chTextsAll(){
  if(chTextCache)return chTextCache;
  chTextCache=[];
  SUBJ.forEach(s=>{
    s.chapters.forEach(ch=>{
      let t=ch.title+'\n';
      ch.blocks.forEach(b=>{
        if(b.k==='table')t+='\n'+b.v.map(r=>r.join(' | ')).join('\n')+'\n';
        else if(b.k==='img')t+=' [插图:'+(b.v.name||'')+(b.v.cap||'')+'] ';
        else if(typeof b.v==='string')t+=b.v+'\n';
      });
      (s.mind.byCh[ch.id]||[]).forEach(m=>{t+='[思维导图·'+(m.title||'')+'] '+m.t.replace(/\s+/g,' ').slice(0,600)+'\n';});
      chTextCache.push({sid:s.id,sname:s.name,cid:ch.id,title:ch.title,t:t.slice(0,22000)});
    });
  });
  return chTextCache;
}
function tokenizeQ(q){
  const stop=new Set(['什么','怎么','如何','请问','一下','关于','哪些','为什么','简述','说说','讲讲','介绍','帮忙','帮我','是不是','有没有','如何理解','的','了','吗','呢','和','与','及','或','在','是','有','我','你','他','请','么','吧','啊','这','那','以及','还有','区别']);
  const ws=q.toLowerCase().split(/[\s，。！？、；：“”‘’（）(),.!?;:'"<>【】\[\]]+/).filter(w=>w.length>=2&&!stop.has(w));
  const out=new Set(ws);
  ws.forEach(w=>{
    if(/^[\u4e00-\u9fa5]{3,}$/.test(w)){
      for(let i=0;i<=w.length-2;i++)out.add(w.slice(i,i+2));
    }
  });
  return [...out];
}
function retrieve(question){
  const words=tokenizeQ(question);
  if(!words.length)return [];
  const chs=chTextsAll();
  const scored=chs.map(c=>{
    const lt=c.t.toLowerCase(),lti=c.title.toLowerCase();
    let sc=0;
    words.forEach(w=>{
      const n=lt.split(w).length-1;
      if(n)sc+=Math.min(n,8)*(w.length>=3?2:1);
      if(lti.includes(w))sc+=6;
    });
    return {c,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,4);
  const budget=9000;let used=0;const parts=[];
  for(const {c} of scored){
    const paras=c.t.split('\n').map(p=>p.trim()).filter(p=>p.length>=6);
    const hit=paras.filter(p=>words.some(w=>p.toLowerCase().includes(w)));
    const chosen=(hit.length?hit:paras.slice(0,6)).slice(0,16);
    let text='【'+c.sname+'·'+c.title+'】\n'+chosen.join('\n');
    if(used+text.length>budget)text=text.slice(0,Math.max(0,budget-used));
    if(text.length<40)continue;
    parts.push({ref:c,text});
    used+=text.length;
    if(used>=budget)break;
  }
  return parts;
}
function mdLite(t){
  let s=esc(t);
  s=s.replace(/^#{1,5}\s*(.+)$/gm,'<b>$1</b>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^\s*[-*]\s+/gm,'• ');
  return s;
}
function openAIChat(){
  setActiveNav('aichat');
  current=null;
  const nCh=SUBJ.reduce((a,s)=>a+s.chapters.length,0);
  document.getElementById('main-inner').innerHTML=`<h2 class="chtitle">🤖 AI 提问</h2>
   <div class="chsrc">AI 知识库 = 全站资料（5 科 · ${nCh} 章笔记 + 思维导图）。提问后自动检索最相关章节交给 DeepSeek 作答，并标注来源章节。需在 ⚙ 设置 中填入 DeepSeek API Key。</div>
   <div id="chatlog"></div>
   <div id="chatbar"><textarea id="chatin" placeholder="输入问题…（Enter 发送，Shift+Enter 换行）"></textarea><button id="chatsend">发 送</button></div>`;
  renderChatLog();
  history.replaceState(null,'','#aichat');
  setTimeout(()=>{const el=document.getElementById('chatin');if(el)el.focus();},60);
}
function chatMsgHTML(m,mi){
  if(m.role==='user')return `<div class="chatmsg user">${mdLite(m.content)}</div>`;
  const refs=(m.refs||[]).map((r,ri)=>`<span class="chatref" onclick="refGo(${ri},${mi})" title="打开章节">📄 ${esc(r.sname)}·${esc(r.title)}</span>`).join('');
  const body=m.content?mdLite(m.content):'<span id="chatstream" style="color:var(--fg2)">正在检索全站资料…</span>';
  return `<div class="chatmsg ai"><div class="chatbody">${body}</div>${refs?`<div class="chatrefs">${refs}</div>`:''}</div>`;
}
function renderChatLog(){
  const el=document.getElementById('chatlog');if(!el)return;
  el.innerHTML=chatLog().map((m,mi)=>chatMsgHTML(m,mi)).join('')
    ||`<div class="chatempty">还没有提问。试试：「甲亢的治疗方案有哪些？」「消化性溃疡的发病机制」「急性胰腺炎如何鉴别诊断」「糖酵解的关键酶」。<br>回答基于站内笔记资料检索生成，仅供复习参考。</div>`;
  const main=document.getElementById('main');main.scrollTop=main.scrollHeight;
}
function refGo(ri,mi){
  const m=chatLog()[mi];if(!m)return;
  const r=(m.refs||[])[ri];if(!r)return;
  const si=SUBJ.findIndex(s=>s.id===r.sid);
  if(si>=0)openChapter(si,r.cid);
}
async function chatSend(){
  if(chatBusy)return;
  const inp=document.getElementById('chatin');if(!inp)return;
  const q=inp.value.trim();if(!q)return;
  const key=localStorage.getItem('ttsx-dskey');
  if(!key){openSettings();document.getElementById('setKeyMsg').textContent='⚠ AI 提问需要先填入 DeepSeek API Key';return;}
  chatBusy=true;
  const send=document.getElementById('chatsend');if(send)send.disabled=true;
  const log=chatLog();
  log.push({role:'user',content:q});
  log.push({role:'assistant',content:'',refs:[]});
  renderChatLog();
  inp.value='';
  try{
    const parts=retrieve(q);
    const aiMsg=log[log.length-1];
    aiMsg.refs=parts.map(p=>({sid:p.ref.sid,sname:p.ref.sname,title:p.ref.title,cid:p.ref.cid}));
    if(!parts.length){
      aiMsg.content='未能在站内资料中检索到与该问题明显相关的内容。请换个说法（多用医学关键词）再试，或直接打开对应章节使用「🤖 AI总结本章」。';
      renderChatLog();chatSave();return;
    }
    const streamEl=()=>document.getElementById('chatstream');
    const se=streamEl();
    if(se)se.textContent=`已检索到 ${parts.length} 个相关章节：${parts.map(p=>p.ref.sname+'·'+p.ref.title).join('、')}。正在生成回答…`;
    const ctx=parts.map(p=>p.text).join('\n\n————\n\n');
    const hist=log.slice(0,-2).filter(m=>m.content).slice(-6)
      .map(m=>({role:m.role,content:m.content.slice(0,800)}));
    const body=JSON.stringify({model:'deepseek-chat',stream:true,temperature:0.4,max_tokens:4096,
      messages:[
        {role:'system',content:'你是西医综合考研辅导AI助手。请主要依据【参考资料】回答学生的问题：1）回答准确、条理清晰，适当使用加粗标题与列表；2）回答末尾单独一行列出「来源：科目·章节」；3）参考资料不足以回答时，可补充医学知识，但需标注「（资料外补充）」。参考资料来自学生自己的考研笔记库。'},
        ...hist,
        {role:'user',content:'【参考资料】\n'+ctx+'\n\n【问题】'+q}]});
    const r=await aiFetchRetry(body,new AbortController());
    const rd=r.body.getReader(),dec=new TextDecoder();
    let buf='',out='';
    while(true){
      const {done,value}=await rd.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        const m=ln.match(/^data:\s*(.+)$/);
        if(!m||m[1].trim()==='[DONE]')continue;
        try{
          const j=JSON.parse(m[1]);
          const d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(d){
            out+=d;
            const e=streamEl();
            if(e){e.innerHTML=mdLite(out);const main=document.getElementById('main');main.scrollTop=main.scrollHeight;}
          }
        }catch(e){}
      }
    }
    aiMsg.content=out||'（模型未返回内容，请重试）';
    renderChatLog();chatSave();
  }catch(e){
    const aiMsg=chatLog()[chatLog().length-1];
    if(aiMsg&&aiMsg.role==='assistant'&&!aiMsg.content)aiMsg.content='⚠ 出错了：'+e.message+'（请检查 API Key 与网络）';
    renderChatLog();
  }finally{
    chatBusy=false;
    const s2=document.getElementById('chatsend');if(s2)s2.disabled=false;
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  const th=localStorage.getItem('ttsx-theme');

  buildSidebar();showIntro();
  migrateNotes(NOTE_USER);

  document.getElementById('setFont').addEventListener('input',applyFont);
  document.getElementById('setLh').addEventListener('input',applyFont);
  document.getElementById('setKeySave').onclick=saveKey;
  document.getElementById('aiStop').onclick=aiStop;
  document.getElementById('aiClose').onclick=aiClose;
  document.getElementById('aipanel').addEventListener('click',e=>{if(e.target.id==='aipanel')aiClose();});
  // AI 提问（视图动态渲染，用事件委托）
  document.addEventListener('click',e=>{if(e.target&&e.target.id==='chatsend')chatSend();});
  document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='chatin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend();}});
  document.getElementById('lightbox').onclick=()=>{document.getElementById('lightbox').style.display='none';};
  let h=location.hash.slice(1);
  // 双击编辑文字块
  const mainEl=document.getElementById('main');
  mainEl.addEventListener('dblclick',e=>{
    if(!AUTH)return;
    const blk=e.target.closest('.blk');
    if(!blk||!blk.hasAttribute('data-edit'))return;
    blk.contentEditable='true';blk.focus();
  });
  mainEl.addEventListener('blur',e=>{
    const el=e.target;
    if(AUTH&&el.classList&&el.classList.contains('blk')&&el.hasAttribute('data-edit')&&el.contentEditable==='true')onEditBlur(el);
  },true);
  if(h){
    if(h==='aichat'){openAIChat();return;}
    for(let si=0;si<SUBJ.length;si++){
      const s=SUBJ[si];
      if(h===s.id+'-mmg'){openMMGeneral(si);return;}
      const ch=s.chapters.find(c=>c.id===h);
      if(ch){document.getElementById('subj'+si).classList.add('open');openChapter(si,h);return;}
    }
  }
});
